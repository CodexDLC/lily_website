{% load static %}
{% load i18n %}

<script type="application/ld+json">
[
  {% if owner %}
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ owner.name|escapejs }}",
    "jobTitle": "{{ owner.title|escapejs }}",
    "image": "{{ CANONICAL_BASE_URL }}{% if owner.photo %}{{ owner.photo.url }}{% else %}{% static 'img/lily.webp' %}{% endif %}",
    "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}",
    {% if owner.instagram %}
    "sameAs": "https://instagram.com/{{ owner.instagram }}",
    {% endif %}
    "memberOf": {
      "@type": "LocalBusiness",
      "@id": "{{ CANONICAL_BASE_URL }}/#organization",
      "name": "{{ site_settings.company_name|default:'LILY Beauty Salon' }}"
    }
  }{% if team %},{% endif %}
  {% endif %}

  {% for master in team %}
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ master.name|escapejs }}",
    "jobTitle": "{{ master.title|escapejs }}",
    "image": "{% if master.photo %}{{ CANONICAL_BASE_URL }}{{ master.photo.url }}{% else %}https://ui-avatars.com/api/?name={{ master.name|urlencode }}&background=0D8ABC&color=fff{% endif %}",
    "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}",
    {% if master.instagram %}
    "sameAs": "https://instagram.com/{{ master.instagram }}",
    {% endif %}
    "memberOf": {
      "@type": "LocalBusiness",
      "@id": "{{ CANONICAL_BASE_URL }}/#organization",
      "name": "{{ site_settings.company_name|default:'LILY Beauty Salon' }}"
    }
  }{% if not forloop.last %},{% endif %}
  {% endfor %}
]
</script>
