{% load static %}
{% load i18n %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "serviceType": "{{ category.title|escapejs }}",
  "name": "{{ category.title|escapejs }}",
  "description": "{{ category.description|striptags|truncatechars:200|escapejs }}",
  "image": "{{ CANONICAL_BASE_URL }}{% if category.image %}{{ category.image.url }}{% else %}{% static 'img/default_service.webp' %}{% endif %}",
  "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}",
  "provider": {
    "@type": "LocalBusiness",
    "@id": "{{ CANONICAL_BASE_URL }}/#organization",
    "name": "{{ site_settings.company_name|default:'LILY Beauty Salon' }}",
    "url": "{{ CANONICAL_BASE_URL }}/"
  },
  "offers": [
    {% for service in category.services.all %}
    {
      "@type": "Offer",
      "name": "{{ service.title|escapejs }}",
      "description": "{{ service.description|striptags|truncatechars:100|escapejs }}",
      "priceSpecification": {
        "@type": "PriceSpecification",
        "price": "{% load l10n %}{% localize off %}{{ service.price|default:'0' }}{% endlocalize %}",
        "priceCurrency": "EUR"
      },
      "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
