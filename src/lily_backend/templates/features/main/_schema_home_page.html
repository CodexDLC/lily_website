{% load static %}
{% load i18n %}

<script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "{% firstof seo.seo_title site_settings.company_name 'LILY Beauty Salon' %}",
    "description": "{% firstof seo.seo_description 'Premium Beauty Salon in Köthen.' %}",
    "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}"
  },
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "@id": "{{ CANONICAL_BASE_URL }}/#organization",
    "name": "{{ site_settings.company_name|default:'LILY Beauty Salon' }}",
    "image": "{{ CANONICAL_BASE_URL }}{% static 'img/logo_lily.webp' %}",
    {% if site_settings.phone %}"telephone": "{{ site_settings.phone }}",{% endif %}
    {% if site_settings.email %}"email": "{{ site_settings.email }}",{% endif %}
    "priceRange": "{{ site_settings.price_range|default:'$$' }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site_settings.address_street|default:'Lange Str. 12' }}",
      "addressLocality": "{{ site_settings.address_locality|default:'Köthen' }}",
      "postalCode": "{{ site_settings.address_postal_code|default:'06366' }}",
      "addressCountry": "DE"
    },
    {% if site_settings.latitude and site_settings.longitude %}
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "{% load l10n %}{% localize off %}{{ site_settings.latitude }}{% endlocalize %}",
      "longitude": "{% localize off %}{{ site_settings.longitude }}{% endlocalize %}"
    },
    {% endif %}
    "url": "{{ CANONICAL_BASE_URL }}{{ request.path }}",
    "openingHours": [
      {% if site_settings.working_hours_weekdays and ":" in site_settings.working_hours_weekdays %}
      "Mo-Fr {{ site_settings.working_hours_weekdays|cut:' ' }}"{% if site_settings.working_hours_saturday and ":" in site_settings.working_hours_saturday or site_settings.working_hours_sunday and ":" in site_settings.working_hours_sunday %},{% endif %}
      {% endif %}
      {% if site_settings.working_hours_saturday and ":" in site_settings.working_hours_saturday %}
      "Sa {{ site_settings.working_hours_saturday|cut:' ' }}"{% if site_settings.working_hours_sunday and ":" in site_settings.working_hours_sunday %},{% endif %}
      {% endif %}
      {% if site_settings.working_hours_sunday and ":" in site_settings.working_hours_sunday %}
      "Su {{ site_settings.working_hours_sunday|cut:' ' }}"
      {% endif %}
    ],
    "sameAs": [
      "{{ site_settings.facebook_url|default:'https://www.facebook.com/lilybeautysalonkoethen/' }}"{% if site_settings.instagram_url %},
      "{{ site_settings.instagram_url }}"{% endif %}
    ],
    "potentialAction": {
      "@type": "ReserveAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "{{ CANONICAL_BASE_URL }}/{% if LANGUAGE_CODE != 'de' %}{{ LANGUAGE_CODE }}/{% endif %}booking/",
        "inLanguage": "{{ LANGUAGE_CODE }}",
        "actionPlatform": [
          "https://schema.org/DesktopWebPlatform",
          "https://schema.org/MobileWebPlatform"
        ]
      },
      "result": {
        "@type": "Reservation",
        "name": "{% trans 'Online-Terminbuchung' %}"
      }
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "{% trans 'Beauty Services' %}",
      "itemListElement": [
        {% for cat in bento %}
        {
          "@type": "OfferCatalog",
          "name": "{{ cat.title }}",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "{{ cat.title }}",
                "url": "{{ CANONICAL_BASE_URL }}{% url 'main:service_detail' slug=cat.slug %}"
              }
            }
          ]
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
      ]
    }
  }
]
</script>
